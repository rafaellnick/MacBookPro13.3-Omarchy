# Local fixes for touchbar.service from mbp133-hardware-support 2.0.0.
#
# 1. The shipped unit gates on ConditionPathExistsGlob=/sys/bus/hid/devices/
#    0003:05AC:8600.0001. That trailing field is the kernel's global HID device
#    counter, not a fixed address - on this machine the two iBridge interfaces
#    enumerate as .0007 and .0008, so the condition never matched and the
#    service was skipped at every boot ("start condition unmet"). Match any
#    suffix instead.
#
# 2. The shipped script hard-codes .0002 as the interface to reclaim from
#    hid-sensor-hub, which fails for the same reason. ExecStart points at a
#    local copy that discovers both interfaces at runtime, and additionally
#    loads industrialio-triggered-buffer so the ambient light sensor resolves
#    its symbols.
#
# Both settings are cleared before being reset - that is how a systemd drop-in
# replaces a value rather than appending to it. If a future
# mbp133-hardware-support fixes these upstream, delete this drop-in and the
# script at /usr/local/sbin/touchbar-enable-dynamic.sh.

[Unit]
ConditionPathExistsGlob=
ConditionPathExistsGlob=/sys/bus/hid/devices/0003:05AC:8600.*

[Service]
ExecStart=
ExecStart=/usr/local/sbin/touchbar-enable-dynamic.sh
