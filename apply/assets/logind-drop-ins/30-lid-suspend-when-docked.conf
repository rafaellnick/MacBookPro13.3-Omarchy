# Close the lid -> suspend, even with an external monitor attached.
#
# systemd-logind treats "an external display is connected" as docked, and
# HandleLidSwitchDocked defaults to ignore. That is why closing the lid
# blanked the built-in panel (Hyprland reacting to eDP-1 going away) but
# never suspended: logind logged "Lid closed." and deliberately did nothing.
#
# Set this back to ignore if you ever want clamshell mode (lid shut, keep
# running on the external monitor).
[Login]
HandleLidSwitchDocked=suspend
