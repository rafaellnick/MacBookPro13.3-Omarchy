# System suspend is disabled temporarily because the Radeon cannot be powered
# back on after apple-gmux cuts its rails; the last attempt hard-reset during
# the pre-suspend hook. Keep lid close non-destructive while a safe S3/S4 path
# is validated.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
