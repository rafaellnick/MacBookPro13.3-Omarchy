# MacBookPro13,3 (i7-6820HQ + Radeon Pro 455) power tuning.

# Keep normal performance while plugged in, and select TLP's dedicated
# power-saver profile whenever the machine is running from the battery.
TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=SAV

# Skylake-H remains responsive at this ceiling for desktop work, while avoiding
# the steep power increase near its full 2.7 GHz base clock. The AC profile is
# unrestricted. TLP applies the SAV values automatically on battery.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=60
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=60
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_SAV=0

# Bluetooth is currently unused. Power it down on battery only when no device
# is connected, and restore it on AC. A manual unblock on battery still works.
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth"
DEVICES_TO_ENABLE_ON_AC="bluetooth"

# THE big one, measured twice at the battery terminals: 3.5-4.5 W.
# amdgpu parks this Polaris part at its top shader clock (855 MHz) while
# reporting 0% busy. Clamping to 214 MHz costs nothing at idle.
# TLP's default here is "auto", which actively overwrote the clamp on every
# AC/battery transition - that is why it kept reverting.
# If the panel ever flickers or video stutters, set ON_AC back to auto
# (mclk also drops to 300 MHz at this level).
RADEON_DPM_PERF_LEVEL_ON_AC=low
RADEON_DPM_PERF_LEVEL_ON_BAT=low

# Deliberately NOT set, with reasons:
#   PCIE_ASPM_* - ASPM is BIOS-controlled here; the sysfs knob is read-only.
#   amdgpu runtime PM - this GMUX Mac has no supported native runtime-PM path;
#     the guarded vga_switcheroo service cuts its rails in iGPU mode instead.
